name: toolchain-diagnostics

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository layout
        run: |
          test -f Makefile
          test -d src
          test -d .github/workflows
          echo "Repository layout: OK"

      - name: Download and inspect iOS toolchain
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/ios-toolchain.tar.lzma"
          EXTRACT="$RUNNER_TEMP/ios-toolchain"
          LOG="$RUNNER_TEMP/toolchain-diagnostics.txt"
          mkdir -p "$EXTRACT"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$ARCHIVE" \
            "https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"

          tar --lzma -xf "$ARCHIVE" -C "$EXTRACT"

          CLANG="$(find "$EXTRACT" -path '*/bin/clang' -print -quit)"
          if [ -z "$CLANG" ] || [ ! -x "$CLANG" ]; then
            echo "ERROR: clang executable not found in toolchain archive"
            exit 1
          fi

          TOOLCHAIN_ROOT="$(dirname "$(dirname "$CLANG")")"
          LLVM_LIB="$(find "$TOOLCHAIN_ROOT" -name 'libLLVM-10.so' -printf '%h\n' -quit)"
          if [ -z "$LLVM_LIB" ]; then
            echo "ERROR: libLLVM-10.so is missing from the extracted toolchain"
            find "$TOOLCHAIN_ROOT" -maxdepth 4 -type f -name '*.so*' -print
            exit 1
          fi

          {
            echo "clang path: $CLANG"
            echo "LLVM library directory: $LLVM_LIB"
            echo
            echo "=== clang --version ==="
            LD_LIBRARY_PATH="$LLVM_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$CLANG" --version
            echo
            echo "=== ldd ==="
            ldd "$CLANG"
          } 2>&1 | tee "$LOG"

          if grep -q 'not found' "$LOG"; then
            echo "ERROR: clang has unresolved shared-library dependencies"
            exit 1
          fi

          echo "Toolchain dynamic-link check: OK"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-diagnostics
          path: ${{ runner.temp }}/toolchain-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7

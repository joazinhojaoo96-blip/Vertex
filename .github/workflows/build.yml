name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl git zip \
            libxml2-dev libtinfo5 libz3-dev zlib1g-dev \
            lzma liblzma-dev patchelf

      # ── Theos ────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$THEOS"

      # ── Toolchain: arm64e LLVM clang ──────────────────────────
      - name: Install iOS toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="$THEOS/toolchain/linux/iphone"
          mkdir -p "$TOOLCHAIN_DIR"

          TC_ARCHIVE="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"
          curl -fL --retry 3 -o /tmp/toolchain.tar.lzma "$TC_ARCHIVE"
          TMP=$(mktemp -d)
          tar --lzma -xf /tmp/toolchain.tar.lzma -C "$TMP"
          mv "$TMP"/ios-arm64e-clang-toolchain/* "$TOOLCHAIN_DIR/"
          rm -rf "$TMP" /tmp/toolchain.tar.lzma

          LLVM_LIB=$(find "$TOOLCHAIN_DIR" -name 'libLLVM*.so*' -printf '%h\n' -quit 2>/dev/null || true)
          if [ -z "$LLVM_LIB" ]; then
            LLVM_LIB="$TOOLCHAIN_DIR/lib"
          fi

          export LD_LIBRARY_PATH="${LLVM_LIB}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$TOOLCHAIN_DIR/bin/clang" --version
          echo "LLVM_LIB=$LLVM_LIB" >> "$GITHUB_ENV"

      # ── iOS SDKs ─────────────────────────────────────────────
      - name: Install iOS SDKs
        run: |
          rm -rf "$THEOS/sdks"
          git clone --depth=1 \
            https://github.com/theos/sdks.git "$THEOS/sdks"

      # ── ldid (codesign tool) ─────────────────────────────────
      - name: Install ldid
        run: |
          mkdir -p "$THEOS/bin"
          if ! command -v ldid &>/dev/null && [ ! -x "$THEOS/bin/ldid" ]; then
            curl -fsSL -o "$THEOS/bin/ldid" \
              "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
            chmod +x "$THEOS/bin/ldid"
          fi

      # ── Build .deb ───────────────────────────────────────────
      - name: Build packages
        run: |
          export LD_LIBRARY_PATH="${LLVM_LIB:-}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 messages=yes

      # ── Package .ipa for iPhone / TrollStore ─────────────────
      - name: Package .ipa
        run: |
          mkdir -p Payload/Vertex.app
          DEB=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -n "$DEB" ]; then
            echo "Extracting binaries from $DEB..."
            dpkg-deb -x "$DEB" /tmp/deb_extracted
            find /tmp/deb_extracted -type f -name "vertex" -exec cp {} Payload/Vertex.app/vertex \;
            find /tmp/deb_extracted -type f -name "vertexhook.dylib" -exec mkdir -p Payload/Vertex.app/Frameworks \; -exec cp {} Payload/Vertex.app/Frameworks/ \;
          fi

          chmod +x Payload/Vertex.app/vertex 2>/dev/null || true

          if [ -d Resources ]; then
            cp -r Resources/* Payload/Vertex.app/ 2>/dev/null || true
          fi

          cp Info.plist Payload/Vertex.app/Info.plist

          "$THEOS/bin/ldid" -Sentitlements.plist Payload/Vertex.app/vertex 2>/dev/null || true

          mkdir -p packages
          zip -r9 packages/Vertex.ipa Payload
          echo "=== Artifacts ready in packages/ ==="
          ls -lh packages/

      # ── Upload artifacts ─────────────────────────────────────
      - name: Upload artifacts (.deb and .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: vertex-ios-packages
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: warn

      # ── Release on tag ───────────────────────────────────────
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.ipa

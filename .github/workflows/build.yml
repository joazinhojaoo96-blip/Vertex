name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl libtinfo6 dpkg-dev curl xz-utils lzma
          # sbingner toolchain needs libtinfo.so.5; ubuntu-22/24 ships libtinfo.so.6
          if [ ! -f /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 \
                        /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          fi

      - name: install theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: install sdks
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/theos/sdks"

      - name: install ios toolchain
        run: |
          curl -fsSL -o /tmp/toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf /tmp/toolchain.tar.lzma -C "$TMP"
          mkdir -p "$HOME/theos/toolchain/linux/iphone"
          mv "$TMP"/ios-arm64e-clang-toolchain/* "$HOME/theos/toolchain/linux/iphone/"
          rm -rf "$TMP" /tmp/toolchain.tar.lzma

      - name: install ldid
        run: |
          curl -fsSL -o "$HOME/theos/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/theos/bin/ldid"
          sudo ln -sf "$HOME/theos/bin/ldid" /usr/local/bin/ldid

      - name: build package
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: collect artifacts
        run: |
          mkdir -p dist
          find packages -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-package
          path: dist/*
          if-no-files-found: error

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

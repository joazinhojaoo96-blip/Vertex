name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl libtinfo6 dpkg-dev curl xz-utils

      - name: install theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: install sdks
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/theos/sdks"

      - name: install ios toolchain
        run: |
          # theos.dev official docs URL — kabiroberai swift-toolchain-linux v2.1.0
          curl -fsSL \
            https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.1.0/swift-5.6.1-ubuntu20.04.tar.xz \
            | tar -xJ -C "$HOME/theos/toolchain"

      - name: install ldid
        run: |
          curl -fsSL -o "$HOME/theos/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/theos/bin/ldid"
          sudo ln -sf "$HOME/theos/bin/ldid" /usr/local/bin/ldid
          ldid 2>&1 | head -n 1 || true

      - name: build package
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: collect artifacts
        run: |
          mkdir -p dist
          find packages -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-package
          path: dist/*
          if-no-files-found: error

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

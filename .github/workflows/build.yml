name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl git zip \
            libxml2-dev libtinfo5 libz3-dev zlib1g-dev \
            lzma liblzma-dev patchelf

      # ── Theos ────────────────────────────────────────────────
      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git "$THEOS"

      # ── Toolchain: arm64e LLVM clang ──────────────────────────
      - name: Install iOS toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="$THEOS/toolchain/linux/iphone"
          mkdir -p "$TOOLCHAIN_DIR"

          TC_ARCHIVE="https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma"
          curl -fL --retry 3 -o /tmp/toolchain.tar.lzma "$TC_ARCHIVE"
          TMP=$(mktemp -d)
          tar --lzma -xf /tmp/toolchain.tar.lzma -C "$TMP"
          mv "$TMP"/ios-arm64e-clang-toolchain/* "$TOOLCHAIN_DIR/"
          rm -rf "$TMP" /tmp/toolchain.tar.lzma

          LLVM_LIB=$(find "$TOOLCHAIN_DIR" -name 'libLLVM*.so*' -printf '%h\n' -quit 2>/dev/null || true)
          if [ -z "$LLVM_LIB" ]; then
            LLVM_LIB="$TOOLCHAIN_DIR/lib"
          fi

          export LD_LIBRARY_PATH="${LLVM_LIB}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$TOOLCHAIN_DIR/bin/clang" --version
          echo "LLVM_LIB=$LLVM_LIB" >> "$GITHUB_ENV"

      # ── iOS SDKs ─────────────────────────────────────────────
      - name: Install iOS SDKs
        run: |
          rm -rf "$THEOS/sdks"
          git clone --depth=1 \
            https://github.com/theos/sdks.git "$THEOS/sdks"

      # ── ldid (codesign tool) ─────────────────────────────────
      - name: Install ldid
        run: |
          mkdir -p "$THEOS/bin"
          if ! command -v ldid &>/dev/null && [ ! -x "$THEOS/bin/ldid" ]; then
            curl -fsSL -o "$THEOS/bin/ldid" \
              "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
            chmod +x "$THEOS/bin/ldid"
          fi

      # ── Build .deb ───────────────────────────────────────────
      - name: Build packages
        run: |
          export LD_LIBRARY_PATH="${LLVM_LIB:-}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      # ── Package .ipa for TrollStore / Sideload ──────────────
      - name: Package .ipa
        run: |
          mkdir -p Payload/Vertex.app
          # Copy compiled binary and resources
          BIN_PATH=$(find .theos/_ -type f -name vertex 2>/dev/null | head -1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find .theos/obj -type f -name vertex 2>/dev/null | head -1)
          fi
          cp "$BIN_PATH" Payload/Vertex.app/vertex
          chmod +x Payload/Vertex.app/vertex

          # Copy hook dylib into Frameworks
          HOOK_PATH=$(find .theos -type f -name "vertexhook.dylib" 2>/dev/null | head -1)
          if [ -n "$HOOK_PATH" ]; then
            mkdir -p Payload/Vertex.app/Frameworks
            cp "$HOOK_PATH" Payload/Vertex.app/Frameworks/
          fi

          # Copy Resources if present
          if [ -d Resources ]; then
            cp -r Resources/* Payload/Vertex.app/ 2>/dev/null || true
          fi

          # Create Info.plist for iOS App
          cat << 'EOF' > Payload/Vertex.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CFBundleExecutable</key>
	<string>vertex</string>
	<key>CFBundleIdentifier</key>
	<string>com.vertex.tool</string>
	<key>CFBundleName</key>
	<string>Vertex</string>
	<key>CFBundlePackageType</key>
	<string>APPL</string>
	<key>CFBundleShortVersionString</key>
	<string>1.0</string>
	<key>CFBundleVersion</key>
	<string>1</string>
	<key>MinimumOSVersion</key>
	<string>15.0</string>
	<key>UIDeviceFamily</key>
	<array>
		<integer>1</integer>
		<integer>2</integer>
	</array>
</dict>
</plist>
EOF

          # Pseudo-sign with entitlements
          "$THEOS/bin/ldid" -Sentitlements.plist Payload/Vertex.app/vertex 2>/dev/null || true

          # Create .ipa
          mkdir -p packages
          zip -r9 packages/Vertex.ipa Payload
          echo "Vertex.ipa successfully built:"
          ls -la packages/

      # ── Upload artifacts ─────────────────────────────────────
      - name: Upload artifacts (.deb and .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: vertex-ios-packages
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: warn

      # ── Release on tag ───────────────────────────────────────
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.ipa

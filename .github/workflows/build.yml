name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot git perl dpkg-dev curl xz-utils \
            libtinfo-dev libxml2-dev libncurses-dev zlib1g-dev patchelf file
          # shim .so.5 names for sbingner toolchain linked against older ubuntu
          for lib in libtinfo libncurses; do
            versioned=$(find /usr/lib/x86_64-linux-gnu -name "${lib}.so.*" | sort -V | tail -1)
            dst="/usr/lib/x86_64-linux-gnu/${lib}.so.5"
            [ -n "$versioned" ] && [ ! -f "$dst" ] && sudo ln -sf "$versioned" "$dst"
          done

      - name: install theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: install sdks
        run: |
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/theos/sdks"

      - name: install ios toolchain
        run: |
          curl -fsSL -o /tmp/toolchain.tar.lzma \
            https://github.com/sbingner/llvm-project/releases/download/v10.0.0-2/linux-ios-arm64e-clang-toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf /tmp/toolchain.tar.lzma -C "$TMP"
          mkdir -p "$HOME/theos/toolchain/linux/iphone"
          mv "$TMP"/ios-arm64e-clang-toolchain/* "$HOME/theos/toolchain/linux/iphone/"
          rm -rf "$TMP" /tmp/toolchain.tar.lzma
          # strip stale RPATH from every ELF so the system linker resolves libs
          BINDIR="$HOME/theos/toolchain/linux/iphone/bin"
          for f in "$BINDIR"/*; do
            if [ -f "$f" ] && file "$f" | grep -q ELF; then
              patchelf --remove-rpath "$f" 2>/dev/null || true
            fi
          done
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version

      - name: install ldid
        run: |
          curl -fsSL -o "$HOME/theos/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/theos/bin/ldid"
          sudo ln -sf "$HOME/theos/bin/ldid" /usr/local/bin/ldid

      - name: build package
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: collect artifacts
        run: |
          mkdir -p dist
          find packages -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-package
          path: dist/*
          if-no-files-found: error

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl libtinfo6 dpkg-dev curl xz-utils

      - name: install theos + sdks
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"

      - name: install ios toolchain
        run: |
          curl -fsSL -o iOSToolchain.tar.xz \
            https://github.com/L1ghtmann/iOSToolchain-x86_64.tar.xz
          mkdir -p "$HOME/tc-extract"
          tar -xJf iOSToolchain.tar.xz -C "$HOME/tc-extract"
          if [ -d "$HOME/tc-extract/toolchain" ]; then
            mv "$HOME/tc-extract/toolchain" "$HOME/theos/toolchain"
          else
            mkdir -p "$HOME/theos/toolchain"
            mv "$HOME/tc-extract"/* "$HOME/theos/toolchain/"
          fi
          rm -rf "$HOME/tc-extract" iOSToolchain.tar.xz

      - name: install ldid
        run: |
          curl -fsSL -o "$HOME/theos/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/theos/bin/ldid"
          sudo ln -sf "$HOME/theos/bin/ldid" /usr/local/bin/ldid
          ldid 2>&1 | head -n 1 || true

      - name: build package
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1

      - name: collect artifacts
        run: |
          mkdir -p dist
          find packages -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist || true

      - uses: actions/upload-artifact@v4
        with:
          name: vertex-package
          path: dist/*
          if-no-files-found: error

      - name: release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
